name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  android-native:
    name: Native Android Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify native project
        run: |
          chmod +x gradlew
          ./gradlew verifyNative verifyRelease --no-daemon
