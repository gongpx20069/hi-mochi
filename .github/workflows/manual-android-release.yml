name: Manual Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Allocate next Android version
        id: version
        shell: pwsh
        working-directory: .
        run: |
          . ./scripts/AndroidReleaseTools.ps1
          $version = Get-MochiNextVersion
          $commit = (git rev-parse HEAD).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Restore release signing key
        shell: bash
        env:
          MOCHI_SIGNING_KEYSTORE_BASE64:
            ${{ secrets.MOCHI_SIGNING_KEYSTORE_BASE64 }}
          MOCHI_SIGNING_STORE_PASSWORD:
            ${{ secrets.MOCHI_SIGNING_STORE_PASSWORD }}
          MOCHI_SIGNING_KEY_ALIAS:
            ${{ secrets.MOCHI_SIGNING_KEY_ALIAS }}
          MOCHI_SIGNING_KEY_PASSWORD:
            ${{ secrets.MOCHI_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$MOCHI_SIGNING_KEYSTORE_BASE64"
          test -n "$MOCHI_SIGNING_STORE_PASSWORD"
          test -n "$MOCHI_SIGNING_KEY_ALIAS"
          test -n "$MOCHI_SIGNING_KEY_PASSWORD"
          echo "$MOCHI_SIGNING_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > signing.properties <<EOF
          storeFile=release.jks
          storePassword=$MOCHI_SIGNING_STORE_PASSWORD
          keyAlias=$MOCHI_SIGNING_KEY_ALIAS
          keyPassword=$MOCHI_SIGNING_KEY_PASSWORD
          EOF

      - name: Verify and build signed release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew verifyNative verifyRelease \
            "-PmochiVersionName=$VERSION" --no-daemon

      - name: Prepare and validate release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        shell: pwsh
        working-directory: .
        run: |
          . ./scripts/AndroidReleaseTools.ps1
          New-MochiReleaseAssets `
            -Version $env:VERSION `
            -Commit $env:COMMIT `
            -SourceOutputDirectory android/app/build/outputs/apk/release `
            -ExtensionSourceOutputDirectory `
              android/extensions/mijia/build/outputs/apk/release `
            -DestinationDirectory "android/Mochi-$env:TAG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mochi-${{ steps.version.outputs.tag }}
          path: android/Mochi-${{ steps.version.outputs.tag }}/
          if-no-files-found: error

      - name: Reserve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        shell: bash
        working-directory: .
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$COMMIT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        working-directory: .
        run: |
          notes="$(cat <<'EOF'
          ## Choose your APK / 选择安装包

          - **`arm64-v8a`**: most current Android phones and tablets / 目前绝大多数手机和平板（推荐）
          - **`armeabi-v7a`**: older 32-bit ARM devices / 较老的 32 位 ARM 设备
          - **`x86_64`**: 64-bit Android emulators or rare Intel devices / 64 位模拟器或少见 Intel 设备
          - **`x86`**: 32-bit Android emulators or older Intel devices / 32 位模拟器或更早 Intel 设备
          - **`universal`**: use only when the architecture is unknown; this is the largest download / 不确定架构时使用，体积最大
          - **`Mochi-Mijia-Extension`**: optional Mi Home Tools; install beside Mochi, with no extra launcher icon / 可选米家工具扩展，与 Mochi 一同安装且不会增加桌面图标

          All variants provide the same Mochi features.
          EOF
          )"
          gh release create "$TAG" \
            "android/Mochi-$TAG/"*.apk \
            "android/Mochi-$TAG/"*SHA256SUMS.txt \
            --verify-tag \
            --title "Mochi $VERSION" \
            --notes "$notes" \
            --generate-notes
