name: Release Android APK

on:
  push:
    tags:
      - "v1.0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches Android version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts

      - name: Restore release signing key
        shell: bash
        env:
          MOCHI_SIGNING_KEYSTORE_BASE64:
            ${{ secrets.MOCHI_SIGNING_KEYSTORE_BASE64 }}
          MOCHI_SIGNING_STORE_PASSWORD:
            ${{ secrets.MOCHI_SIGNING_STORE_PASSWORD }}
          MOCHI_SIGNING_KEY_ALIAS:
            ${{ secrets.MOCHI_SIGNING_KEY_ALIAS }}
          MOCHI_SIGNING_KEY_PASSWORD:
            ${{ secrets.MOCHI_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$MOCHI_SIGNING_KEYSTORE_BASE64"
          echo "$MOCHI_SIGNING_KEYSTORE_BASE64" | base64 --decode > release.jks
          cat > signing.properties <<EOF
          storeFile=release.jks
          storePassword=$MOCHI_SIGNING_STORE_PASSWORD
          keyAlias=$MOCHI_SIGNING_KEY_ALIAS
          keyPassword=$MOCHI_SIGNING_KEY_PASSWORD
          EOF

      - name: Verify and build release APK
        run: |
          chmod +x gradlew
          ./gradlew verifyNative verifyRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "Mochi-${GITHUB_REF_NAME}.apk"
          sha256sum "Mochi-${GITHUB_REF_NAME}.apk" \
            > "Mochi-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            android/Mochi-${{ github.ref_name }}.apk
            android/Mochi-${{ github.ref_name }}.apk.sha256
