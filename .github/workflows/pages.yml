name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate website
        run: python website/tests/validate_site.py

      - name: Prepare website artifact
        run: |
          mkdir _site
          cp website/index.html website/styles.css website/scripts.js _site/
          cp website/404.html website/robots.txt website/sitemap.xml _site/
          cp website/.nojekyll _site/
          cp -R website/assets website/zh-CN website/agentlink website/wiki _site/

      - name: Upload website artifact
        id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true

      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '.total_count')"
            if [ "$count" = "1" ]; then
              exit 0
            fi
            echo "Waiting for exactly one $ARTIFACT_NAME artifact (found: $count)."
            sleep 5
          done
          echo "::error::Uploaded Pages artifact was not uniquely visible within 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Missing uploaded Pages artifact ID')
            }
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            })
            core.setOutput('deployment_id', deployment.id)
            core.setOutput('page_url', deployment.page_url)
            const failed = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'])
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...context.repo,
                deployment_id: deployment.id
              })
              core.info(`Pages deployment status: ${data.status}`)
              if (data.status === 'succeed') return
              if (failed.has(data.status)) throw new Error(`Pages deployment failed: ${data.status}`)
              await new Promise(resolve => setTimeout(resolve, 10000))
            }
            throw new Error('Pages deployment did not complete within 10 minutes')

      - name: Cancel unfinished Pages deployment
        if: ${{ (failure() || cancelled()) && steps.deployment.outputs.deployment_id != '' }}
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel', {
              ...context.repo,
              deployment_id: process.env.DEPLOYMENT_ID
            })
