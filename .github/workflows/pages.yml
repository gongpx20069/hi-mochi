name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate website
        run: python website/tests/validate_site.py

      - name: Prepare website artifact
        run: |
          mkdir _site
          cp website/index.html website/styles.css website/scripts.js _site/
          cp website/404.html website/robots.txt website/sitemap.xml _site/
          cp website/.nojekyll _site/
          cp -R website/assets website/zh-CN website/agentlink website/wiki _site/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --paginate --slurp --jq "[.[].artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")"
            if [ "$count" = "1" ]; then
              exit 0
            fi
            echo "Waiting for exactly one $ARTIFACT_NAME artifact (found: $count)."
            sleep 5
          done
          echo "::error::Uploaded Pages artifact was not uniquely visible within 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
